[project]
name = "wotagent-prototype"
version = "2.0.0"
description = "WoTAgent 2.0 — observable LangGraph control for TD-described IoT devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "langchain>=1.0.0",
  "langchain-openai>=0.1.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "fastmcp>=1.0.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "jsonschema>=4.20.0",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.2.1",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "real_model: opt-in tests that call the configured external LLM",
  "simulator: opt-in tests that require the local device simulator",
]

[project.scripts]
wotagent = "wotagent.cli:main"
